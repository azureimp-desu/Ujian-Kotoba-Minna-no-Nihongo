<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ujian Kotoba Bab 42</title><style>
:root{--bg:#f3f6f4;--ink:#1c2b2a;--mute:#5d6f6c;--card:#fff;--line:#cfdad7;--accent:#1f6f6b;--ok:#2e7d4f;--bad:#b3392f}
@media (prefers-color-scheme:dark){:root{--bg:#121a19;--ink:#e6efed;--mute:#93a7a3;--card:#1b2625;--line:#2f3f3d;--accent:#5cc0b8;--ok:#5fc489;--bad:#ef7f74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}p.sub{color:var(--mute);margin:0 0 20px}
a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{color:var(--mute);font-size:.9rem;display:flex;justify-content:space-between}
.q{font-size:2rem;margin:14px 0 4px;font-weight:600;word-break:break-word}
.hint{color:var(--mute);font-size:.95rem;margin-bottom:16px;min-height:1.4em}
.opts{display:grid;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;padding:12px 14px;background:transparent;border:1px solid var(--line);border-radius:8px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.btn{margin:16px 8px 0 0;padding:11px 20px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
@media (prefers-color-scheme:dark){.btn{color:#0b1514}}
.score{font-size:3rem;font-weight:700;margin:8px 0}
.review{margin:16px 0 0;padding:0;list-style:none;font-size:.95rem}
.review li{padding:8px 0;border-top:1px solid var(--line)}
.review b{color:var(--bad)}.review .right{color:var(--ok);font-weight:700}
.hidden{display:none}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.best{color:var(--mute);margin:0 0 4px}
.note{color:var(--mute);font-size:.9rem;margin-top:4px}
.grid small.ok{color:var(--ok);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.grid a{display:block;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-decoration:none;color:var(--ink)}
.grid a:hover{border-color:var(--accent)}.grid small{color:var(--mute);display:block}
</style></head><body><main>
<p><a href="index.html">&larr; Semua bab</a></p>
<h1>Ujian Kotoba Bab 42</h1><p class="sub">Pilih arti yang benar dari kata Jepang. Bab ini ada 77 kata.</p>
<div class="card" id="start"><p class="best" id="best"></p><p>Soal diacak setiap kali mulai. Benar atau salahnya baru ditampilkan setelah ujian selesai.</p><button class="btn" id="go">Mulai (20 soal)</button><button class="btn alt" id="goall">Semua kata (77)</button></div>
<div class="card hidden" id="quiz"><div class="bar"><i id="prog"></i></div><div class="meta"><span id="num"></span><span id="sc"></span></div>
<div class="q" id="word"></div><div class="hint" id="read"></div><div class="opts" id="opts"></div><button class="btn" id="submit" disabled>Lanjut</button><button class="btn hidden" id="next">Lanjut</button></div>
<div class="card hidden" id="end"><div class="meta"><span>Hasil ujian</span></div><div class="score" id="final"></div><div id="msg"></div><div class="note" id="note"></div><ul class="review" id="review"></ul>
<button class="btn hidden" id="retry">Ulangi yang salah</button><button class="btn" id="again">Ulangi</button><a class="btn alt" href="index.html">Bab lain</a></div>
</main><script>
const BAB=42;
const WORDS=[["つつみます", "包みます", "Membungkus"], ["わかします", "沸かします", "Merebus"], ["まぜます", "混ぜます", "Mencampur"], ["けいさんします", "計算します", "Menghitung"], ["あつい", "厚い", "Tebal"], ["うすい", "薄い", "Tipis"], ["べんごし", "弁護士", "Pengacara"], ["おんがくか", "音楽家", "Ahli musik, pemusik"], ["きょういく", "教育", "Pendidikan"], ["れきし", "歴史", "Sejarah"], ["ぶんか", "文化", "Kebudayaan"], ["しゃかい", "社会", "Masyarakat"], ["ほうりつ", "法律", "Hukum"], ["せんそう", "戦争", "Perang"], ["へいわ", "平和", "Damai"], ["もくてき", "目的", "Tujuan,makud"], ["あんぜん", "安全", "Keselamatan, keamanan"], ["ろんぶん", "論文", "Tesis, skripsi"], ["かんけい", "関係", "Hubungan"], ["ミキサー", "", "Blender"], ["やかん", "", "Ceret, teko"], ["せんぬき", "栓抜き", "Pembuka tutup botol"], ["かんきり", "缶切り", "Pembuka kaleng"], ["かんづめ", "缶詰", "Makanan kaleng"], ["ふろしき", "", "Kain pembungkus untuk membawa barang"], ["そろばん", "", "Alat hitung cina, sempoa"], ["たいおんけい", "体温計", "Termometer"], ["ざいりょう", "材料", "Bahan-bahan"], ["いし", "石", "Batu"], ["ピラミッド", "", "Piramida"], ["データ", "", "Data"], ["ファイル", "", "File"], ["なぜ", "", "Mengapa, kenapa?"], ["こくれん", "国連", "Negara kesatuan"], ["ローン", "", "Kredit"], ["セット", "", "Set"], ["あと", "", "Sisa"], ["カップラーメン", "", "Mie instan gelas"], ["インスタントラーメン", "", "Mie instan"], ["なべ", "", "Panci"], ["どんぶり", "", "Mangkok besar"], ["しょくひん", "食品", "Makanan"], ["ちょうさ", "調査", "Penyelidikan"], ["カップ", "", "Gelas"], ["～のかわりに", "～の代わりに", "Pengganti -"], ["とじる", "", "Menjilid"], ["ホッチキス", "", "Hekter/stapler"], ["はさむ", "", "Menjepit"], ["クリップ", "", "Klip"], ["とめる", "留める", "Menyematkan"], ["がびょう／おしピン", "画びょう／押しピン", "Paku payung"], ["きる", "切る", "Memotong"], ["カッター", "", "Cutter"], ["はさみ", "鋏", "Gunting"], ["はる", "", "Menempelkan"], ["セロテープ", "", "Selotip"], ["ガムテープ", "", "Selotip kertas"], ["のり", "", "Lem"], ["けずる", "削る", "Meruncingkan"], ["えんぴつけずり", "鉛筆削り", "Peruncing pensil"], ["ファイルする", "", "Mengarsipkan"], ["けす", "消す", "Menghapus"], ["けしゴム", "", "Penghapus karet"], ["しゅうせいえき", "修正液", "Tip ex"], ["パンチ", "", "Alat pelubang kertas"], ["あなをあける", "穴をあける", "Melubangi"], ["けいさんする", "計算する", "Menghitung"], ["でんたく", "電卓", "Kalkulator"], ["のこぎり", "", "Gergaji"], ["くぎをうつ", "くぎを打つ", "Memaku"], ["かなづち", "金づち", "Palu besi"], ["せんをひく", "線を引く", "Membuat garis"], ["じょうぎ", "定規", "Penggaris"], ["ものさし", "", "Penggaris"], ["ペンチ", "", "Tang"], ["ねじをしめる", "ねじを締める", "Memasang sekrup"], ["ゆるめる", "緩める", "Melonggarkan"]];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let qs,idx,score,wrong,locked,sel,retry;
const KEY="kotoba:bab"+BAB;
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(pct){try{const o=load()||{best:0,runs:0};o.runs++;if(pct>o.best)o.best=pct;if(pct===100)o.perfect=true;localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function showBest(){const o=load();$("best").textContent=o?(o.perfect?"✓ Sudah pernah nilai sempurna. ":"")+"Nilai terbaik: "+o.best+"% ("+o.runs+"x ujian)":"Belum pernah ujian bab ini."}
function start(n,list){
  retry=!!list;qs=list?shuffle(list):shuffle(WORDS).slice(0,n);idx=0;score=0;wrong=[];
  $("start").classList.add("hidden");$("end").classList.add("hidden");$("quiz").classList.remove("hidden");show();
}
function show(){
  locked=false;sel=null;const [w,k,a]=qs[idx];
  $("num").textContent=(retry?"Ulangi yang salah: ":"")+"Soal "+(idx+1)+" dari "+qs.length;$("sc").textContent="";
  $("prog").style.width=(idx/qs.length*100)+"%";
  $("word").textContent=w;$("read").textContent=k?"Kanji: "+k:"";
  const pool=[...new Set(WORDS.map(x=>x[2]).filter(t=>t!==a))];
  const box=$("opts");box.innerHTML="";
  shuffle([a,...shuffle(pool).slice(0,3)]).forEach(t=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>{if(locked)return;sel=t;document.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o===b));$("submit").disabled=false};
    box.appendChild(b);
  });
  $("submit").disabled=true;$("submit").textContent=idx===qs.length-1?"Selesai":"Lanjut";$("next").classList.add("hidden");
}
function submit(){
  if(sel===null)return;
  if(sel===qs[idx][2]){score++}else{wrong.push([...qs[idx],sel])}
  idx++;idx<qs.length?show():finish();
}
function finish(){
  $("quiz").classList.add("hidden");$("end").classList.remove("hidden");
  const pct=Math.round(score/qs.length*100);
  $("final").textContent=score+" / "+qs.length+" ("+pct+"%)";
  if(!retry){save(pct);$("note").textContent=pct===100?"Nilai sempurna tersimpan di bab ini.":"Nilai tersimpan. Nilai terbaik hanya naik kalau hasilmu lebih tinggi."}
  else{$("note").textContent="Ini latihan ulang, nilainya tidak disimpan."}
  $("msg").textContent=pct===100?"Sempurna!":pct>=80?"Bagus sekali!":pct>=60?"Lumayan, ulangi sedikit lagi.":"Perlu belajar lagi, semangat!";
  $("retry").classList.toggle("hidden",wrong.length===0);
  const ul=$("review");ul.innerHTML="";
  if(wrong.length){
    const h=document.createElement("li");h.style.border="0";h.textContent="Yang masih salah:";ul.appendChild(h);
    wrong.forEach(([w,k,a,t])=>{
      const li=document.createElement("li");
      li.innerHTML="<strong></strong><br>Jawabanmu: <b></b><br>Jawaban benar: <span class='right'></span>";
      li.querySelector("strong").textContent=w+(k?" ("+k+")":"");li.querySelector("b").textContent=t;li.querySelector(".right").textContent=a;ul.appendChild(li);
    });
  }else{const li=document.createElement("li");li.style.border="0";li.textContent="Semua jawabanmu benar!";ul.appendChild(li)}
}
$("submit").onclick=submit;
$("retry").onclick=()=>{const l=wrong.map(x=>x.slice(0,3));start(0,l)};
$("again").onclick=()=>{$("end").classList.add("hidden");$("start").classList.remove("hidden");showBest()};
$("next").onclick=()=>{idx++;idx<qs.length?show():finish()};
showBest();

$("go").onclick=()=>start(20);
if($("goall"))$("goall").onclick=()=>start(WORDS.length);
</script></body></html>
